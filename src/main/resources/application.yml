server:
  port: 8095
  # Pinned: the /resolve client key depends on Tomcat's RemoteIpValve, which only this strategy installs.
  forward-headers-strategy: native

spring:
  application:
    name: gua-resolver
  datasource:
    url: ${GUA_RESOLVER_DB_URL:jdbc:postgresql://localhost:5432/gua_resolver}
    username: ${GUA_RESOLVER_DB_USER:resolver}
    password: ${GUA_RESOLVER_DB_PASSWORD:resolver}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: gua-resolver
  prometheus:
    metrics:
      export:
        enabled: true

resilience4j:
  ratelimiter:
    instances:
      directoryLookup:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 0s
      placementRecords:
        limit-for-period: 20
        limit-refresh-period: 1s
        timeout-duration: 0s

gua:
  resolver:
    mode: ${GUA_RESOLVER_MODE:AUTHORITY}
    directory:
      # Must match identity-service. Required at runtime.
      pepper: ${GUA_RESOLVER_DIRECTORY_PEPPER:}
      fail-open-on-lookup-error: ${GUA_RESOLVER_DIRECTORY_FAIL_OPEN_ON_LOOKUP_ERROR:false}
      checkpoint-interval: ${GUA_RESOLVER_DIRECTORY_CHECKPOINT_INTERVAL:PT5M}
    claims:
      audience: ${GUA_RESOLVER_CLAIMS_AUDIENCE:gua-resolver}
      max-clock-skew: ${GUA_RESOLVER_CLAIMS_MAX_CLOCK_SKEW:PT2M}
      max-lifetime: ${GUA_RESOLVER_CLAIMS_MAX_LIFETIME:PT5M}
      replay-protection-enabled: ${GUA_RESOLVER_CLAIMS_REPLAY_PROTECTION_ENABLED:true}
      require-subject-binding: ${GUA_RESOLVER_CLAIMS_REQUIRE_SUBJECT_BINDING:true}
      replay-cleanup-interval: ${GUA_RESOLVER_CLAIMS_REPLAY_CLEANUP_INTERVAL:PT10M}
      trusted-keys: []
    # With no password hash there are no admin users and /authority/** stays denied.
    admin:
      username: ${GUA_RESOLVER_ADMIN_USER:admin}
      password-hash: ${GUA_RESOLVER_ADMIN_PASSWORD_HASH:}
    # Both buckets are per pod; the limit shared across replicas is enforced at the ingress.
    abuse:
      enabled: ${GUA_RESOLVER_ABUSE_ENABLED:true}
      client-limit-for-period: ${GUA_RESOLVER_ABUSE_CLIENT_LIMIT_FOR_PERIOD:20}
      client-refresh-period: ${GUA_RESOLVER_ABUSE_CLIENT_REFRESH_PERIOD:PT1M}
      client-burst: ${GUA_RESOLVER_ABUSE_CLIENT_BURST:20}
      global-limit-for-period: ${GUA_RESOLVER_ABUSE_GLOBAL_LIMIT_FOR_PERIOD:200}
      global-refresh-period: ${GUA_RESOLVER_ABUSE_GLOBAL_REFRESH_PERIOD:PT1S}
      global-burst: ${GUA_RESOLVER_ABUSE_GLOBAL_BURST:200}
      max-tracked-clients: ${GUA_RESOLVER_ABUSE_MAX_TRACKED_CLIENTS:10000}
      client-expiry: ${GUA_RESOLVER_ABUSE_CLIENT_EXPIRY:PT5M}
      # Returns policy internals to anonymous callers; off unless a deployment opts in.
      trace-enabled: ${GUA_RESOLVER_ABUSE_TRACE_ENABLED:false}
    policy:
      enabled: ${GUA_RESOLVER_POLICY_ENABLED:false}
      file: ${GUA_RESOLVER_POLICY_FILE:}
      require-signatures: ${GUA_RESOLVER_POLICY_REQUIRE_SIGNATURES:true}
      signature-threshold: ${GUA_RESOLVER_POLICY_SIGNATURE_THRESHOLD:1}
      signing-key-id: ${GUA_RESOLVER_POLICY_KEY_ID:}
      signing-private-key: ${GUA_RESOLVER_POLICY_PRIVATE_KEY:}
      refresh-interval: ${GUA_RESOLVER_POLICY_REFRESH_INTERVAL:PT1M}
      trusted-keys: []
    authority:
      threshold: ${GUA_RESOLVER_AUTHORITY_THRESHOLD:1}
      signing-key-id: ${GUA_RESOLVER_AUTHORITY_KEY_ID:}
      signing-private-key: ${GUA_RESOLVER_AUTHORITY_PRIVATE_KEY:}
      trusted-keys:
        - id: ${GUA_RESOLVER_AUTHORITY_KEY_ID:}
          public-key: ${GUA_RESOLVER_AUTHORITY_PUBLIC_KEY:}
    mirror:
      upstream-url: ${GUA_RESOLVER_MIRROR_UPSTREAM_URL:}
      refresh-interval: ${GUA_RESOLVER_MIRROR_REFRESH_INTERVAL:PT5M}
      cache-file: ${GUA_RESOLVER_MIRROR_CACHE_FILE:}
      lookup-timeout: ${GUA_RESOLVER_MIRROR_LOOKUP_TIMEOUT:PT3S}
      # How long a mirror may serve a cached positive lookup during an authority outage. Zero disables it.
      directory-cache-ttl: ${GUA_RESOLVER_MIRROR_DIRECTORY_CACHE_TTL:PT10M}

    # When true, an ACTIVE entry without a valid member self-signature is not served or routed to.
    roster:
      require-member-signature: ${GUA_RESOLVER_ROSTER_REQUIRE_MEMBER_SIGNATURE:false}
      member-max-lifetime: ${GUA_RESOLVER_ROSTER_MEMBER_MAX_LIFETIME:P400D}

    # With no file configured, governance is off.
    genesis:
      file: ${GUA_RESOLVER_GENESIS_FILE:}
      transitions-file: ${GUA_RESOLVER_GENESIS_TRANSITIONS_FILE:}
      expected-id: ${GUA_RESOLVER_GENESIS_EXPECTED_ID:}
      # The genesis id, or the hash of the last applied transition. Update it at each key rotation.
      expected-chain-head: ${GUA_RESOLVER_GENESIS_EXPECTED_CHAIN_HEAD:}

    # Re-sign the policy bundle with the governance key before turning this on, or startup fails.
    governance:
      required: ${GUA_RESOLVER_GOVERNANCE_REQUIRED:false}

    # Shadow mode: no routing answer reads these records.
    placement:
      enabled: ${GUA_RESOLVER_PLACEMENT_ENABLED:false}
      ingest-enabled: ${GUA_RESOLVER_PLACEMENT_INGEST_ENABLED:false}
      checkpoint-interval: ${GUA_RESOLVER_PLACEMENT_CHECKPOINT_INTERVAL:PT1H}
      audit-interval: ${GUA_RESOLVER_PLACEMENT_AUDIT_INTERVAL:PT5M}
      metrics-interval: ${GUA_RESOLVER_PLACEMENT_METRICS_INTERVAL:PT1M}
      max-validity: ${GUA_RESOLVER_PLACEMENT_MAX_VALIDITY:P400D}
      default-page-size: ${GUA_RESOLVER_PLACEMENT_DEFAULT_PAGE_SIZE:100}
      max-page-size: ${GUA_RESOLVER_PLACEMENT_MAX_PAGE_SIZE:500}

    dev-homeserver:
      id: ${GUA_RESOLVER_DEVHOMESERVER_ID:dev}
      server-name: ${GUA_RESOLVER_DEVHOMESERVER_SERVERNAME:gua.local}
      base-url: ${GUA_RESOLVER_DEVHOMESERVER_BASEURL:https://matrix.gua.local}
      mas-issuer: ${GUA_RESOLVER_DEVHOMESERVER_MASISSUER:https://account.gua.local}
      region: ${GUA_RESOLVER_DEVHOMESERVER_REGION:dev}
      signing-key: ${GUA_RESOLVER_DEVHOMESERVER_SIGNINGKEY:}
