plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'global.gua'
version = '0.0.1-SNAPSHOT'
description = 'gua-resolver — federation routing front door (resolution + roster + placement)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-ratelimiter:2.2.0'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('memberEntryTool', JavaExec) {
    group = 'application'
    description = 'Sign, rotate or verify a gua-member-entry.v1 roster attestation'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'global.gua.resolver.tools.MemberEntryTool'
    standardInput = System.in
}

tasks.register('governanceVectors', JavaExec) {
    group = 'documentation'
    description = 'Regenerate docs/specs/gua-governance-v1-vectors.json'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'global.gua.resolver.governance.GovernanceVectorsGenerator'
}

tasks.register('govTool', JavaExec) {
    group = 'application'
    description = 'Create a federation genesis, or sign a membership epoch, policy bundle or key transition'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'global.gua.resolver.tools.GovTool'
    standardInput = System.in
}
