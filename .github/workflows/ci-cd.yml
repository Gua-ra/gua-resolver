name: CI/CD

# A PR labelled deploy:dev deploys that branch to dev. A merge to main deploys dev and stages prod
# for approval.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment for this manual run"
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  IMAGE: ghcr.io/gua-ra/gua-resolver
  # Only people with write access can label a PR.
  DEPLOY_LABEL: deploy:dev

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      deploy-to-dev: ${{ steps.gate.outputs.dev }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test
        run: ./gradlew test --no-daemon

      - name: Decide whether this PR asked for a dev deploy
        id: gate
        # A fork PR has no registry credentials, so it never deploys.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ] \
             && ${{ contains(github.event.pull_request.labels.*.name, 'deploy:dev') }}; then
            echo "dev=true" >> "$GITHUB_OUTPUT"
          else
            echo "dev=false" >> "$GITHUB_OUTPUT"
          fi

  # Origin repo only: the publish and deploy jobs skip in a fork.
  build:
    needs: test
    if: >-
      github.repository == 'Gua-ra/gua-resolver' && (
        github.event_name != 'pull_request' ||
        needs.test.outputs.deploy-to-dev == 'true')
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      deploy-to-dev: ${{ needs.test.outputs.deploy-to-dev }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image ref (immutable sha tag)
        id: ref
        run: echo "ref=${IMAGE}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Deploys use the immutable sha tag; the dev tag tracks main.
          tags: |
            type=sha,format=long
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=pr-${{ github.event.number }},enable=${{ github.event_name == 'pull_request' }}
      - name: Build + push (amd64 = the k3s target; arm64 for local dev)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs on the in-cluster least-privilege runner, which can patch only the gua-resolver Deployment.
  deploy-dev:
    needs: build
    if: >-
      github.repository == 'Gua-ra/gua-resolver' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev') ||
        needs.build.outputs.deploy-to-dev == 'true')
    runs-on: [self-hosted, gua-resolver-incluster]
    environment: dev
    steps:
      - name: Roll out ${{ needs.build.outputs.ref }} to dev
        run: |
          IMG="${{ needs.build.outputs.ref }}"
          kubectl -n gua patch deployment/gua-resolver --type=strategic \
            -p "{\"spec\":{\"template\":{\"spec\":{\"imagePullSecrets\":[{\"name\":\"ghcr-pull\"}],\"containers\":[{\"name\":\"gua-resolver\",\"image\":\"$IMG\",\"imagePullPolicy\":\"IfNotPresent\"}]}}}}"
          kubectl -n gua rollout status deployment/gua-resolver --timeout=180s

      - name: Tell the PR where it went
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Deployed to **dev** (ns \`gua\`): \`${{ needs.build.outputs.ref }}\`\n\nDev keeps running this build until something else is deployed over it. Merging to main returns dev to main's build.`
            })

  # Waits for approval of the production environment, and for a runner labelled
  # gua-resolver-incluster-prod; until one is registered the job queues.
  deploy-prod:
    needs: build
    if: >-
      github.repository == 'Gua-ra/gua-resolver' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'))
    runs-on: [self-hosted, gua-resolver-incluster-prod]
    environment: production
    steps:
      - name: Roll out ${{ needs.build.outputs.ref }} to prod
        run: |
          IMG="${{ needs.build.outputs.ref }}"
          kubectl -n gua-prod patch deployment/gua-resolver --type=strategic \
            -p "{\"spec\":{\"template\":{\"spec\":{\"imagePullSecrets\":[{\"name\":\"ghcr-pull\"}],\"containers\":[{\"name\":\"gua-resolver\",\"image\":\"$IMG\",\"imagePullPolicy\":\"IfNotPresent\"}]}}}}"
          kubectl -n gua-prod rollout status deployment/gua-resolver --timeout=180s
