name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment for this manual run"
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/gua-ra/gua-resolver

jobs:
  # Runs on every push, PR, and manual dispatch. This is the gate PRs get.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test
        run: ./gradlew test --no-daemon

  # Image build + push to GHCR. Never on pull_request (no publishing from a PR), only push/dispatch,
  # and ONLY in the origin repo. A fork/clone runs `test` above (so anyone can build + test), but the
  # publish + deploy jobs skip cleanly in a fork: to run your own Gua resolver, change this guard to your
  # repo, point IMAGE at your own GHCR namespace, and provide your own deploy target/runner.
  build:
    needs: test
    if: github.repository == 'Gua-ra/gua-resolver' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image ref (immutable sha tag)
        id: ref
        run: echo "ref=${IMAGE}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build + push (amd64 = the k3s target; arm64 for local dev)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # AUTOMATIC on merge to main; also manually dispatchable to roll a branch onto dev for QA.
  # Runs on the dedicated in-cluster, least-privilege runner (gua-deploy k8s/cicd/
  # gua-resolver-deploy-runner.yaml): a public repo must not get the privileged host `dev`
  # runner. The runner's ServiceAccount can patch ONLY the gua-resolver Deployment, and it
  # uses the in-cluster kube API (no sudo, no kubeconfig secret).
  deploy-dev:
    needs: build
    if: >-
      github.repository == 'Gua-ra/gua-resolver' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev'))
    runs-on: [self-hosted, gua-resolver-incluster]
    environment: dev
    steps:
      - name: Roll out ${{ needs.build.outputs.ref }} to dev
        run: |
          IMG="${{ needs.build.outputs.ref }}"
          # Single strategic patch: ensure the ghcr-pull secret (self-heals bootstrap drift where the live
          # deployment was created from a local image without it) AND set the new immutable sha-tagged image,
          # so the pod can pull from GHCR. One template change = one rollout.
          kubectl -n gua patch deployment/gua-resolver --type=strategic \
            -p "{\"spec\":{\"template\":{\"spec\":{\"imagePullSecrets\":[{\"name\":\"ghcr-pull\"}],\"containers\":[{\"name\":\"gua-resolver\",\"image\":\"$IMG\",\"imagePullPolicy\":\"IfNotPresent\"}]}}}}"
          kubectl -n gua rollout status deployment/gua-resolver --timeout=180s

  # MANUAL GATE: pauses until a maintainer approves the `production` GitHub Environment.
  # Uses a distinct prod-scoped in-cluster runner (stand one up alongside the dev runner when prod exists,
  # mirroring gua-deploy k8s/cicd/gua-resolver-deploy-runner.yaml with a prod label + prod-cluster context).
  deploy-prod:
    needs: build
    if: github.repository == 'Gua-ra/gua-resolver' && github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    runs-on: [self-hosted, gua-resolver-incluster-prod]
    environment: production
    steps:
      - name: Roll out ${{ needs.build.outputs.ref }} to prod
        run: |
          IMG="${{ needs.build.outputs.ref }}"
          kubectl -n gua patch deployment/gua-resolver --type=strategic \
            -p "{\"spec\":{\"template\":{\"spec\":{\"imagePullSecrets\":[{\"name\":\"ghcr-pull\"}],\"containers\":[{\"name\":\"gua-resolver\",\"image\":\"$IMG\",\"imagePullPolicy\":\"IfNotPresent\"}]}}}}"
          kubectl -n gua rollout status deployment/gua-resolver --timeout=180s
